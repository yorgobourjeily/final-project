@if (user(); as me) {
  <header class="page-header">
    <p class="eyebrow">Student portal</p>
    <h1>Hello, {{ me.name }}</h1>
    <p>
      {{ today | date: 'EEEE d MMMM y' }}
      @if (me.studentNumber) {
        · Student ID <strong>{{ me.studentNumber }}</strong>
      }
    </p>
    <p>Look at the classroom camera when you arrive for each class.</p>
  </header>

  <app-student-attendance [studentId]="me.id" />
}
