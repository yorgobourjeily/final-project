@if (label()) {
  <label class="search-label" [for]="inputId">{{ label() }}</label>
}
<div class="search">
  <input
    [id]="inputId"
    [value]="value()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (click)="onFocus()"
    (blur)="onBlur()"
    (keydown.enter)="onEnter($event)"
    (keydown.escape)="open.set(false)"
    [placeholder]="placeholder()"
    [attr.inputmode]="numeric() ? 'numeric' : null"
    autocomplete="off"
    role="combobox"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-controls]="listId"
    [attr.aria-expanded]="open()"
  />
  @if (open()) {
    <ul class="matches" [id]="listId" role="listbox" aria-label="Matching accounts">
      @for (s of matches(); track s.id) {
        <li role="option" [attr.aria-selected]="s.loginId === typed()">
          <button
            type="button"
            class="match"
            [class.current]="s.loginId === typed()"
            (mousedown)="$event.preventDefault()"
            (click)="pick(s)"
          >
            <span class="match-id">{{ s.loginId }}</span>
            <span class="match-name">{{ s.name }}</span>
          </button>
        </li>
      } @empty {
        <li class="no-match">Nobody has an ID containing "{{ typed() }}".</li>
      }
    </ul>
  }
</div>
@if (!open() && !clearOnPick() && exact(); as s) {
  <p class="hint found">{{ s.name }}</p>
} @else if (!open() && typed() && !exact()) {
  <p class="hint none">Nobody has the ID "{{ typed() }}".</p>
}
