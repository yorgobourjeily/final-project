<div class="stats">
  <div class="stat">
    <span class="stat-value">{{ rate() }}%</span>
    <span class="stat-label">Attendance rate</span>
  </div>
  <div class="stat" data-status="present">
    <span class="stat-value">{{ counts().present }}</span>
    <span class="stat-label">Present</span>
  </div>
  <div class="stat" data-status="late">
    <span class="stat-value">{{ counts().late }}</span>
    <span class="stat-label">Late</span>
  </div>
  <div class="stat" data-status="absent">
    <span class="stat-value">{{ counts().absent }} <small>/ {{ maxAbsences() }}</small></span>
    <span class="stat-label">Absences</span>
  </div>
</div>
